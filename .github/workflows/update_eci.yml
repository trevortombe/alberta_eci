# Updates the Alberta ECI whenever new data are out. Runs each weekday after StatCan's 8:30 ET releases;
# commits only when the index itself changes, and keeps a dated copy of each new release.
name: UpdateECI
on:
  schedule:
    - cron: '17 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pre-built Linux binaries: no compiling
      - uses: r-lib/actions/setup-r-dependencies@v2   # installs and caches packages between runs
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::ggplot2
            any::scales
            any::zoo
            any::lubridate
            any::jsonlite
            any::seasonal
            any::tempdisagg
      - name: Run R script
        run: Rscript AlbertaECI.R
      - name: Commit results if the index changed
        run: |
          if git diff --quiet -- Data/ECI_Index_Data.csv; then echo "No new data"; exit 0; fi
          cp Data/ECI_Index_Data.csv "Data/vintages/ECI_$(date -u +%F).csv"
          git config user.email "trevor.tombe@gmail.com"
          git config user.name "Trevor Tombe"
          git add Data Figures README.md
          git commit -m "Update ECI"
          git push
