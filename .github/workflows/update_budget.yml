# This updates the Alberta realtime budget projection daily
name: UpdateBudget
on:
  schedule:
    - cron: '45 21 * * *'   # after NYMEX settlement and the daily Reuters WCS report
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pre-built Linux binaries: no compiling
      # Same package list as update_eci.yml, so both workflows share one cache
      - uses: r-lib/actions/setup-r-dependencies@v2   # installs and caches packages between runs
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::ggplot2
            any::scales
            any::zoo
            any::lubridate
            any::jsonlite
            any::seasonal
            any::tempdisagg
            any::tidyverse
            any::quantmod
            any::curl
            any::readxl
            any::ggthemes
      - name: Run R script
        run: Rscript AB_budget.R
      - name: Commit results
        run: |
          git config user.email "trevor.tombe@gmail.com"
          git config user.name "Trevor Tombe"
          git add '*.png' Data/wcs_differential.csv
          git commit -m "Update All Plots" || echo "No changes to commit"
          git push origin || echo "No changes to commit"
